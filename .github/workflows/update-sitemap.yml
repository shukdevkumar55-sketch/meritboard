name: Auto Generate Sitemap

on:
  push:
    paths:
      - 'data/**'
      - '*.html'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Run Sitemap Script
      run: node scripts/update-sitemap.js

    - name: Commit and Push changes
      run: |
        git config --global user.name "Sitemap Bot"
        git config --global user.email "bot@meritboard.app"
        git add sitemap.xml
        git commit -m "🤖 Auto-updated sitemap.xml" || echo "No changes to commit"
        git push