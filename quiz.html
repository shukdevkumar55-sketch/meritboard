<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Exam Portal | MeritBoard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600&display=swap" rel="stylesheet">
</head>
<body class="quiz-body">

    <!-- 1. Header Area (Quiz Mode) -->
    <header class="quiz-header" id="quizHeader">
        <div class="quiz-nav-top">
            <div id="quizTitle" class="quiz-title">HSSC Exam</div>
            <div class="header-controls">
                <select id="langSelect" class="lang-select">
                    <option value="hi">हिन्दी</option>
                    <option value="en">English</option>
                </select>
                <div class="timer-box">
                    <span id="timerDisplay" class="timer">00:00</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 2. Section Bar (Quiz Mode) -->
    <nav class="section-bar" id="sectionBar">
        <!-- Subjects injected via JS -->
    </nav>

    <!-- 3. Main Quiz Area (Question & Palette) -->
    <main class="quiz-main" id="quizMain">
        <div class="container">
            <!-- Question Card -->
            <section class="question-card">
                <div class="q-header">
                    <span class="q-number" id="qNum">Question 1</span>
                    <span class="q-marks">Marks <span class="pos">+1</span> <span class="neg">-0</span></span>
                </div>
                <h2 id="qText" class="question-text">Loading question...</h2>
                <div id="optionsGrid" class="options-grid"></div>
            </section>

            <!-- Palette Area -->
            <div class="palette-container">
                <button id="togglePalette" class="btn-palette-toggle">View Question Palette</button>
                <div id="questionPalette" class="palette-grid hidden"></div>
                <div class="legend-grid" id="paletteLegend">
                    <div class="leg-item"><span class="leg-box answered"></span> Answered</div>
                    <div class="leg-item"><span class="leg-box marked"></span> Marked</div>
                    <div class="leg-item"><span class="leg-box not-answered"></span> Not Answered</div>
                    <div class="leg-item"><span class="leg-box current"></span> Current</div>
                </div>
            </div>
        </div>
    </main>

    <!-- 4. Footer Controls (Quiz Mode) -->
    <footer class="quiz-footer" id="quizFooter">
        <button id="markReviewBtn" class="btn-ctrl btn-review">Review</button>
        <button id="clearResponseBtn" class="btn-ctrl btn-clear">Clear</button>
        <div class="footer-right">
            <button id="prevBtn" class="btn-ctrl btn-prev">Prev</button>
            <button id="nextBtn" class="btn-ctrl btn-save">Save & Next</button>
        </div>
        <button id="submitBtn" class="btn-ctrl btn-submit hidden">Submit</button>
    </footer>

    <!-- 5. Professional Result & Analysis Page (Visible after Submit) -->
    <div id="analysisPage" class="hidden">
        <div class="result-container">
            <!-- Summary Scorecard -->
            <div class="summary-card">
                <h2 class="congrats-text">Test Report Card</h2>
                <div class="main-score-box">
                    <span id="resFinalScore">0</span>
                    <small>/ <span id="resTotalQs">0</span></small>
                </div>
                <p id="performanceTag">Analyzing Performance...</p>
            </div>

            <!-- Quick Stats Row -->
            <div class="stats-row">
                <div class="stat-box">
                    <span id="resAccuracy">0%</span>
                    <label>Accuracy</label>
                </div>
                <div class="stat-box">
                    <span id="resTime">0m</span>
                    <label>Time Taken</label>
                </div>
                <div class="stat-box">
                    <span id="resAttempted">0</span>
                    <label>Attempted</label>
                </div>
            </div>

            <!-- Subject-wise Analysis -->
            <div class="subject-card">
                <h3 class="section-title-res">Subject Analysis</h3>
                <div id="subjectWiseList">
                    <!-- Data injected via JS -->
                </div>
            </div>

            <!-- Detailed Question-wise Solutions -->
            <div class="solutions-header">
                <h3 class="section-title-res">Question Wise Solutions</h3>
                <p>Correct answers are highlighted in <span style="color:green; font-weight:bold;">Green</span></p>
            </div>
            
            <div id="solutionsList">
                <!-- Detailed analysis of all 100 questions -->
            </div>

            <!-- Action Buttons -->
            <div class="result-actions">
                <button onclick="location.reload()" class="btn-retake">Retake Test</button>
                <button onclick="location.href='index.html'" class="btn-home">Back to Home</button>
            </div>
        </div>
    </div>

    <script src="js/quiz.js" type="module"></script>
</body>
</html>
