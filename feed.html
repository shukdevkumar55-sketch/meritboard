<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Browse Content | MeritBoard</title>
    
    <meta name="robots" content="noindex, follow"> 
    <meta name="description" content="Explore Mock Tests, Books, Videos and Articles on MeritBoard.">
    
    <meta name="theme-color" content="#1A237E">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">      
    <link rel="stylesheet" href="css/feed-style.css"> 
</head>
<body>

    <header class="site-header">
        <div class="header-container container">
            
            <div class="brand-area">
                <a href="index.html" class="logo-link">
                    <span class="logo-text">Merit<span>Board</span></span>
                </a>
            </div>

            <nav id="mainNav" class="desktop-nav">
                <a href="index.html" class="nav-item">Home</a>
                <a href="feed.html?type=quiz" class="nav-item">Quizzes</a>
                <a href="feed.html?type=book" class="nav-item">Books</a>
                <a href="feed.html?type=video" class="nav-item">Videos</a>
            </nav>

            <div class="header-actions">
                <button id="themeToggle" class="btn-icon">🌙</button>
                <button id="mobileMenuBtn" class="btn-icon mobile-only">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </div>

        </div>
    </header>

    <section class="feed-header">
        <div class="container">
            <div class="breadcrumb">
                <a href="index.html">Home</a> <span>/</span> <span id="breadCrumbCurrent">Browse</span>
            </div>
            <h1 id="feedTitle">Loading...</h1>
            <p id="feedSubtitle">Please wait while we fetch content</p>
        </div>
    </section>

    <section class="sticky-controls">
        <div class="container">
            
            <div class="category-tabs-wrapper">
                <div id="categoryTabs" class="category-tabs">
                    <button class="tab-btn">Loading...</button>
                </div>
            </div>

            <div class="feed-toolbar" style="justify-content: flex-end;"> 
                <select id="sortBy" class="sort-select">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="az">A-Z Title</option>
                </select>
            </div>
        </div>
    </section>

    <main class="container" style="padding-top: 20px; min-height: 60vh;">
        
        <div id="feedGrid" class="content-grid">
            <div class="content-card" style="height:250px; background:#f0f0f0;"></div>
            <div class="content-card" style="height:250px; background:#f0f0f0;"></div>
            <div class="content-card" style="height:250px; background:#f0f0f0;"></div>
            <div class="content-card" style="height:250px; background:#f0f0f0;"></div>
        </div>

        <div id="emptyState" class="empty-state hidden" style="text-align: center; padding: 40px 0;">
            <span class="empty-state-icon" style="font-size: 3rem;">📭</span>
            <h3>No results found</h3>
            <p>Try adjusting your filters.</p>
            <button onclick="window.location.reload()" class="btn btn-outline" style="margin-top:10px; color:var(--primary-color);">Reset Filters</button>
        </div>

    </main>

    <footer id="dynamicFooter" class="site-footer">
        <div class="container">
            <p>&copy; 2026 MeritBoard. Education for All.</p>
        </div>
    </footer>

    <script src="js/app-core.js"></script> 
    <script src="js/feed-loader.js"></script> 
</body>
</html>
