<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO & Google Indexing -->
    <title>MeritBoard - Prepare. Test. Lead. | Free Mock Tests</title>
    <meta name="description" content="MeritBoard offers free online mock tests, interactive quizzes, and real-time leaderboards.">
    <meta name="author" content="Sukhdev Dahiya">
    <link rel="canonical" href="https://yourusername.github.io/meritboard/">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "MeritBoard",
      "url": "https://yourusername.github.io/meritboard/",
      "founder": { "@type": "Person", "name": "Sukhdev Dahiya" }
    }
    </script>
</head>
<body>
    
        <!-- Universal Header -->
    <header class="header">
        <nav class="nav-container">
            <div class="logo-area">
                <a href="index.html" class="logo-link">
                    <img src="assets/logo.png" alt="MeritBoard Logo" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span class="logo-text" style="display:none;">Merit<span>Board</span></span>
                </a>
            </div>
            <div class="header-actions">
                <button id="searchBtn" class="search-icon-btn" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
        </nav>
    </header>

   <main id="homeContent">
    <!-- 1. Hero Section (यह हमेशा फिक्स रहेगा) -->
    <section class="hero-section">
        <div class="container">
            <h1 class="motivational-quote" id="dailyQuote">Loading daily inspiration...</h1>
            <p class="hero-subtext">Targeting Haryana State Exams? Let's check your rank today!</p>
            <div class="cta-buttons">
                <!-- Anchor link को dynamic container की तरफ मोड़ें -->
                <a href="#dynamicSectionsContainer" class="btn btn-primary">Start Free Test</a>
                <a href="rankings.html" class="btn btn-secondary">View Leaderboard</a>
            </div>
        </div>
    </section>

    <!-- 2. Notice Board (यह भी फिक्स रहेगा) -->
    <section class="notices-section">
        <div class="container">
            <div id="noticesContainer" class="notice-slider">
                <!-- Notices will be injected via JS -->
                Loading latest updates...
            </div>
        </div>
    </section>

    <!-- 3. Dynamic Sections Catch-all Container (सबसे ज़रूरी) -->
    <!-- 
       यहाँ JavaScript अपने आप "Haryana Special", "Popular Quizzes", 
       और भविष्य में "PDF Notes" जैसे सेक्शन्स बना देगी। 
    -->
    <div id="dynamicSectionsContainer">
        <p class="loading">Building your MeritBoard...</p>
    </div>
</main>

    <!-- Universal Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 MeritBoard. Designed by Sukhdev Dahiya.</p>
            <div class="social-links">
                <a href="https://www.instagram.com/vionn.official">Instagram</a>
            </div>
        </div>
    </footer>

    <script src="js/main.js" type="module"></script>
</body>
</html>
